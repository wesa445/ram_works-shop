# Сборка и публикация на GitHub Pages.
#
# Pages отдаёт готовые файлы, собирать их надо здесь. Секретов в сборке нет:
# всё, что уходит в браузер, и так публично.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # кнопка «собрать вручную» во вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Две выкладки подряд не должны наступать друг другу на пятки
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
